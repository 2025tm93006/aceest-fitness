apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
  labels:
    app.kubernetes.io/name: aceest-fitness
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aceest-fitness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
    spec:
      containers:
        - name: aceest-fitness
          # Render this manifest with the image reference from Jenkins.
          image: example.invalid/aceest-fitness:jenkins-build
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ACEEST_DB
              value: /app/instance/aceest.sqlite3
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/instance
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aceest-fitness-data
