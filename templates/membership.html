{% extends 'base.html' %}
{% block title %}Membership | {{ client.name }}{% endblock %}
{% block content %}<main class="login panel"><a class="text-link" href="{{ url_for('index', client_id=client.id) }}">← Dashboard</a><p class="eyebrow">CLIENT MEMBERSHIP</p><h1>Membership</h1><h2>{{ client.name }}</h2><dl class="summary-grid"><div><dt>Status</dt><dd>{{ client.membership_status or 'Not set' }}</dd></div><div><dt>Renewal date</dt><dd>{{ client.membership_end or 'Not set' }}</dd></div></dl></main>{% endblock %}
