<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>{% block title %}ACEest Fitness{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">A</span><span>ACEest <span class="brand-subtitle">FITNESS</span></span></a><div class="header-actions">{% if session.get('user') %}<span class="role-badge">{{ session.get('role') }}</span><form method="post" action="{{ url_for('logout') }}"><button class="button secondary compact">Logout</button></form>{% else %}<span class="role-badge">Client management</span>{% endif %}</div></header>{% block content %}{% endblock %}</body></html>
