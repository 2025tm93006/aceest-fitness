<!doctype html><html><head><meta charset="utf-8"><title>ACEest v2.2.4</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header>ACEest Functional Fitness System <small>v2.2.4</small></header><main><section><h2>Client Management</h2><form method="post" action="/clients"><label>Name<input name="name" required></label><label>Age<input name="age" type="number" min="0"></label><label>Height (cm)<input name="height" type="number" min="0" step="any"></label><label>Weight (kg)<input name="weight" type="number" min="0" step="any"></label><label>Program<select name="program" required><option value="">Choose</option>{%for id,p in programs.items()%}<option value="{{id}}">{{p[0]}}</option>{%endfor%}</select></label><label>Target Weight<input name="target_weight" type="number" min="0" step="any"></label><label>Target Adherence %<input name="target_adherence" type="number" min="0" max="100"></label><button>Save Client</button></form></section><section><h2>Clients</h2><ul>{%for c in clients%}<li><a href="{{url_for('client',cid=c.id)}}">{{c.name}}</a> — {{programs[c.program][0]}}</li>{%else%}<li>No clients saved.</li>{%endfor%}</ul></section></main></body></html>
