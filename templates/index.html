<!doctype html><title>ACEest v3.1.2</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><header>ACEest Functional Fitness System <small>v3.1.2</small><form method="post" action="/logout"><button>Logout {{user}}</button></form></header><main><section><h2>Save Client</h2><form method="post" action="/clients"><label>Name<input name="name" required></label><label>Age<input name="age" type="number" min="0"></label><label>Height<input name="height" type="number" min="0" step="any"></label><label>Weight<input name="weight" type="number" min="0" step="any"></label><label>Program<select name="program">{%for id,p in programs.items()%}<option value="{{id}}">{{p[0]}}</option>{%endfor%}</select></label><label>Target Weight<input name="target_weight" type="number" min="0"></label><label>Target Adherence<input name="target_adherence" type="number" min="0" max="100"></label><label>Membership Expiry<input name="membership_expiry" type="date"></label><button>Save Client</button></form></section><section><h2>Clients</h2><ul>{%for c in clients%}<li><a href="/clients/{{c.id}}">{{c.name}}</a> — {{c.membership_expiry or 'No expiry set'}}</li>{%else%}<li>No clients.</li>{%endfor%}</ul></section></main>
