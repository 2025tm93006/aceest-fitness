<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Weekly Adherence Progress – {{name}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="chart-page"><main class="chart-main"><h1>Weekly Adherence Progress – {{name}}</h1><svg class="line-chart" viewBox="0 0 {{width}} 470" role="img" aria-label="Weekly adherence line chart for {{name}}"><rect width="100%" height="100%" fill="white"/><text x="{{(left+right)/2}}" y="455" text-anchor="middle" class="axis-title">Week</text><text x="20" y="{{(top+bottom)/2}}" text-anchor="middle" transform="rotate(-90 20 {{(top+bottom)/2}})" class="axis-title">Adherence (%)</text>{%for tick in range(0,101,20)%}<line x1="{{left}}" y1="{{bottom-tick*3.2}}" x2="{{right}}" y2="{{bottom-tick*3.2}}" class="grid-line"/><text x="{{left-12}}" y="{{bottom-tick*3.2+5}}" text-anchor="end" class="tick">{{tick}}</text>{%endfor%}<line x1="{{left}}" y1="{{top}}" x2="{{left}}" y2="{{bottom}}" class="axis"/><line x1="{{left}}" y1="{{bottom}}" x2="{{right}}" y2="{{bottom}}" class="axis"/><polyline points="{%for point in points%}{{point.x}},{{point.y}} {%endfor%}" class="progress-line"/>{%for point in points%}<circle cx="{{point.x}}" cy="{{point.y}}" r="5" class="progress-point"><title>{{point.week}}: {{point.adherence}}%</title></circle><text x="{{point.x}}" y="{{bottom+25}}" text-anchor="middle" class="tick week-label">{{point.week}}</text>{%endfor%}</svg></main></body></html>
